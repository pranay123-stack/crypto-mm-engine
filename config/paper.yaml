# Paper trading against live Binance market data.
#
# This is the default configuration. It consumes real market data and runs the
# real strategy, risk engine, OMS and portfolio; only the execution adapter is
# simulated. It is an operational rehearsal environment, not a backtester -- no
# historical data is read and no parameters are fitted here.

mode: paper
session_name: paper

exchange:
  name: binance
  rest_base_url: https://api.binance.com
  ws_base_url: wss://stream.binance.com:9443
  # Even in paper mode, market data uses the public endpoints; no credentials
  # are required and none are read.
  credentials_env_prefix: BINANCE_PAPER
  recv_window_ms: 5000
  rest_timeout_ms: 3000
  book_depth: 50

symbols:
  - symbol: BTCUSDT
    quote_size: 0.001

strategy:
  # TEST/REFERENCE ONLY. reference_mm_v1 exists to validate the runtime; it is
  # not a trading strategy, is not profitable, and is not suitable for live use.
  # Replace this name with the finalized strategy from the research platform.
  name: reference_mm_v1
  version: 1
  enabled: true
  quoting_enabled: true
  evaluation_mode: on_bbo_change_and_timer
  budget_ns: 50000          # 50 us per callback before a violation is counted
  max_consecutive_budget_violations: 5
  max_consecutive_invalid_outputs: 3
  timer_interval_ms: 100
  max_quote_distance_bps: 500

# Finalized parameters, one block per strategy. Only the selected strategy's
# block is used, so a file can carry several and switch by changing the name
# above. Contents are opaque to the engine.
strategies:
  reference_mm_v1:
    half_spread_bps: 4.0
    quote_size: 0.001
    inventory_skew_bps: 8.0
    max_inventory_utilisation: 0.9

# Quote-manager infrastructure controls. These decide WHETHER a resting order is
# worth rewriting -- never what price or size to write, which is the strategy's.
quote:
  max_intent_age_ms: 250
  max_market_data_age_ms: 500
  min_price_move_ticks: 1
  min_quantity_move_fraction: 0.0
  min_replace_interval_ms: 0
  cooldown_after_cancel_ms: 0
  assume_request_lost_after_ms: 1000
  replenish_partial_fills: true

risk:
  # The engine refuses every exposure-adding action unless armed, and arming
  # requires the per-symbol limits below to be set. An unset limit is silently
  # unlimited, which is the one configuration a risk engine must never have.
  enabled: true
  max_market_data_age_ms: 500
  max_position_age_ms: 5000

  # Rate limits. Zero disables one. Cancels are counted but never refused: the
  # moment the system is bursting is the moment withdrawing matters most.
  max_new_orders_per_second: 20
  max_cancels_per_second: 40
  max_replaces_per_second: 20
  max_actions_per_second: 60
  burst_capacity: 40

  symbols:
    BTCUSDT:
      max_position: 0.05
      max_position_notional: 5000
      max_order_quantity: 0.01
      max_order_notional: 1200
      max_working_exposure: 0.1
      max_side_exposure: 0.06
      max_open_orders: 4
      price_band_bps: 500

  max_position: 0.05
  max_notional: 5000
  max_portfolio_notional: 10000
  max_order_qty: 0.01
  max_order_notional: 1200
  max_active_orders_per_symbol: 4
  max_active_orders_total: 20
  max_daily_loss: 200
  max_session_loss: 200
  emergency_loss: 400
  max_quote_distance_bps: 500

oms:
  # Client order ids are minted as <prefix>-<session>-<sequence> in base 36.
  # Binance caps client order ids at 36 characters; the prefix must leave room
  # for the rest, and generation fails rather than truncating -- two orders
  # sharing an id is unrecoverable.
  client_id_prefix: "mmp"
  # Zero derives the session id from the process start time, so ids from two
  # runs cannot collide even if a previous run left orders resting.
  session_id: 0
  max_client_id_length: 36

  # How long the engine will believe a request is still in flight. On expiry
  # the order becomes UNKNOWN -- never CANCELLED. See docs/oms.md §12.
  new_request_timeout_ms: 5000
  cancel_request_timeout_ms: 5000
  replace_request_timeout_ms: 5000

  # Periodic comparison against the venue's open-order listing. Zero disables
  # it; startup reconciliation is separate and not optional.
  reconciliation_interval_ms: 30000

  max_orders: 1024
  journal_enabled: true
  journal_capacity: 65536

execution:
  max_orders_per_second: 20
  max_cancels_per_second: 20
  max_replaces_per_second: 20
  max_messages_per_second: 50
  ack_timeout_ms: 5000
  cancel_timeout_ms: 5000

safety:
  max_market_data_age_ms: 500
  max_processing_delay_ms: 100
  max_clock_skew_ms: 1000
  max_consecutive_rejects: 5
  reconcile_interval_ms: 30000
  live_trading_enabled: false
  cancel_all_on_shutdown: true

paper:
  ack_latency_us: 2000
  fill_latency_us: 1000
  cancel_latency_us: 2000
  maker_fee_bps: 1.0
  taker_fee_bps: 4.0
  # Assume we win the queue race only half the time a trade passes through our
  # price. Assuming every touch fill lands is the fastest way to make a paper
  # run flatter a strategy that will not survive contact with a real book.
  queue_fill_ratio: 0.5
  reject_probability: 0.0

monitoring:
  enabled: true
  http_host: 127.0.0.1
  http_port: 8787
  snapshot_interval_ms: 100

persistence:
  journal_dir: var/journal
  state_file: var/state/engine_state.json
  journal_flush_interval_ms: 200
  fsync_on_flush: true

logging:
  level: info
  dir: var/log
  max_file_bytes: 268435456
  max_files: 10
  console: true

io:
  md_threads: 1
  exec_threads: 1
  trading_cpu: -1           # -1 disables pinning
