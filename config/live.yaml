# Live trading against Binance.
#
# Reaching a real venue requires SIX independent conditions to hold. Five are
# below; the sixth is the --live flag on the command line, which no file can
# supply. Copying this file to another machine therefore cannot cause it to
# trade.
#
#   1. mode: live
#   2. safety.live_trading_enabled: true
#   3. every risk limit set to a positive value
#   4. risk.emergency_loss >= risk.max_daily_loss
#   5. exchange.credentials_env_prefix names an env var pair that exists
#   6. --live passed explicitly at launch
#
# Credentials are NEVER stored here. The adapter reads:
#     ${credentials_env_prefix}_API_KEY
#     ${credentials_env_prefix}_API_SECRET
# See deploy/systemd for how those reach the process.

mode: live
session_name: live

exchange:
  name: binance
  rest_base_url: https://api.binance.com
  ws_base_url: wss://stream.binance.com:9443
  credentials_env_prefix: BINANCE_LIVE
  recv_window_ms: 5000
  rest_timeout_ms: 3000
  book_depth: 50

symbols:
  - symbol: BTCUSDT
    quote_size: 0.001

strategy:
  # Deliberately names a strategy that is NOT in the binary.
  #
  # The only strategy currently registered is reference_mm_v1, which is a test
  # fixture. Shipping a live config that pointed at it would mean a copy-paste
  # away from trading real money with a placeholder. Starting live with this
  # file therefore fails at startup with "no strategy named finalized_mm_v1.
  # Registered: reference_mm_v1", which is the correct outcome until a
  # finalized strategy exists.
  name: finalized_mm_v1
  version: 1
  enabled: true
  quoting_enabled: true
  evaluation_mode: on_bbo_change_and_timer
  budget_ns: 50000
  max_consecutive_budget_violations: 5
  max_consecutive_invalid_outputs: 3
  timer_interval_ms: 100
  max_quote_distance_bps: 300

strategies:
  finalized_mm_v1:
    # Parameters arrive from the research platform alongside the strategy.
    half_spread_bps: 4.0
    quote_size: 0.001

# Deliberately small. These are the limits a first live session should run with;
# raising them is a decision, not a default.
# Quote-manager infrastructure controls. These decide WHETHER a resting order is
# worth rewriting -- never what price or size to write, which is the strategy's.
quote:
  max_intent_age_ms: 250
  max_market_data_age_ms: 500
  min_price_move_ticks: 1
  min_quantity_move_fraction: 0.0
  min_replace_interval_ms: 0
  cooldown_after_cancel_ms: 50
  assume_request_lost_after_ms: 1000
  replenish_partial_fills: true

risk:
  # The engine refuses every exposure-adding action unless armed, and arming
  # requires the per-symbol limits below to be set. An unset limit is silently
  # unlimited, which is the one configuration a risk engine must never have.
  enabled: true
  max_market_data_age_ms: 500
  max_position_age_ms: 5000

  # Rate limits. Zero disables one. Cancels are counted but never refused: the
  # moment the system is bursting is the moment withdrawing matters most.
  max_new_orders_per_second: 20
  max_cancels_per_second: 40
  max_replaces_per_second: 20
  max_actions_per_second: 60
  burst_capacity: 40

  symbols:
    BTCUSDT:
      max_position: 0.05
      max_position_notional: 5000
      max_order_quantity: 0.01
      max_order_notional: 1200
      max_working_exposure: 0.1
      max_side_exposure: 0.06
      max_open_orders: 4
      price_band_bps: 500

  max_position: 0.01
  max_notional: 1000
  max_portfolio_notional: 2000
  max_order_qty: 0.002
  max_order_notional: 250
  max_active_orders_per_symbol: 4
  max_active_orders_total: 12
  max_daily_loss: 50
  max_session_loss: 50
  emergency_loss: 100
  max_quote_distance_bps: 300

oms:
  # Client order ids are minted as <prefix>-<session>-<sequence> in base 36.
  # Binance caps client order ids at 36 characters; the prefix must leave room
  # for the rest, and generation fails rather than truncating -- two orders
  # sharing an id is unrecoverable.
  client_id_prefix: "mml"
  # Zero derives the session id from the process start time, so ids from two
  # runs cannot collide even if a previous run left orders resting.
  session_id: 0
  max_client_id_length: 36

  # How long the engine will believe a request is still in flight. On expiry
  # the order becomes UNKNOWN -- never CANCELLED. See docs/oms.md §12.
  new_request_timeout_ms: 3000
  cancel_request_timeout_ms: 3000
  replace_request_timeout_ms: 3000

  # Periodic comparison against the venue's open-order listing. Zero disables
  # it; startup reconciliation is separate and not optional.
  reconciliation_interval_ms: 15000

  max_orders: 1024
  journal_enabled: true
  journal_capacity: 65536

execution:
  max_orders_per_second: 10
  max_cancels_per_second: 10
  max_replaces_per_second: 10
  max_messages_per_second: 25
  ack_timeout_ms: 5000
  cancel_timeout_ms: 5000

safety:
  max_market_data_age_ms: 300
  max_processing_delay_ms: 50
  max_clock_skew_ms: 500
  max_consecutive_rejects: 3
  reconcile_interval_ms: 15000
  live_trading_enabled: true
  cancel_all_on_shutdown: true

monitoring:
  enabled: true
  http_host: 127.0.0.1
  http_port: 8787
  snapshot_interval_ms: 100

persistence:
  journal_dir: var/journal
  state_file: var/state/engine_state.json
  journal_flush_interval_ms: 200
  fsync_on_flush: true

logging:
  level: info
  dir: var/log
  max_file_bytes: 268435456
  max_files: 20
  console: false

io:
  md_threads: 1
  exec_threads: 1
  trading_cpu: -1
